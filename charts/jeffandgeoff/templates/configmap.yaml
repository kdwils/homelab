apiVersion: v1
kind: ConfigMap
metadata:
  name: jeffandgeoff-image
  labels:
    app.kubernetes.io/name: jeffandgeoff
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head>
        <title>jeffandgeoff</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
      </head>
      <body style="margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#000;">
        <img src="/image.png" alt="jeffandgeoff" style="max-width:100%;max-height:100vh;">
      </body>
    </html>
binaryData:
  image.png: {{ .Files.Get "files/image.jpg" | b64enc }}
