apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: kargo:homelab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kargo
    server: "https://kubernetes.default.svc"
  source:
    path: apps/kargo/environments/homelab
    repoURL: "https://github.com/kdwils/homelab"
    targetRevision: homelab
  sources: []
  project: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-tasks
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kargo
    server: "https://kubernetes.default.svc"
  # Two sources, one Application, so Projects/Stages are never pruned or re-owned:
  #   - kustomize: shared ClusterPromotionTasks, credentials, homelab-chart project
  #   - helm: every per-app Project/Warehouse/Stage, generated from values.yaml
  sources:
    - path: apps/kargo/resources
      repoURL: "https://github.com/kdwils/homelab"
      targetRevision: HEAD
    - path: charts/kargo-projects
      repoURL: "https://github.com/kdwils/homelab"
      targetRevision: HEAD
      helm:
        releaseName: kargo-projects
  project: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
