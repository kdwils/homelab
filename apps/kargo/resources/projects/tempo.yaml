apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: tempo
  annotations:
    kargo.akuity.io/keep-namespace: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: tempo
  namespace: tempo
spec:
  promotionPolicies:
    - stageSelector:
        name: main
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: tempo
  namespace: tempo
spec:
  interval: "1h0m0s"
  subscriptions:
    - chart:
        repoURL: https://grafana.github.io/helm-charts
        name: tempo
    - git:
        repoURL: https://github.com/kdwils/homelab.git
        branch: main
        includePaths:
          - glob:monitoring/tempo/environments/**
          - glob:charts/tempo/**
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: main
  namespace: tempo
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: tempo
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/kdwils/homelab
        - name: targetBranch
          value: main
        - name: warehouse
          value: tempo
      steps:
        - task:
            name: git-ops-clone
            kind: ClusterPromotionTask
        - task:
            name: helm-update-single-chart
            kind: ClusterPromotionTask
          vars:
            - name: chartPath
              value: charts/tempo
            - name: chartRepo
              value: https://grafana.github.io/helm-charts
            - name: chartName
              value: tempo
        - task:
            name: git-ops-commit-pr
            kind: ClusterPromotionTask
          vars:
            - name: commitMessage
              value: |
                Update tempo chart dependencies
            - name: prTitle
              value: "Update tempo chart dependencies"
            - name: prDescription
              value: Update tempo chart dependencies
