apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: cert-manager
  annotations:
    kargo.akuity.io/keep-namespace: "true"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  promotionPolicies:
    - stageSelector:
        name: main
      autoPromotionEnabled: true
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: "1h0m0s"
  subscriptions:
    - chart:
        repoURL: https://charts.jetstack.io
        name: cert-manager
    - git:
        repoURL: https://github.com/kdwils/homelab.git
        branch: main
        includePaths:
          - glob:infra/cert-manager/environments/**
          - glob:charts/cert-manager/**
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: main
  namespace: cert-manager
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: cert-manager
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/kdwils/homelab
        - name: targetBranch
          value: main
        - name: warehouse
          value: cert-manager
      steps:
        - task:
            name: git-ops-clone
            kind: ClusterPromotionTask
        - task:
            name: helm-update-single-chart
            kind: ClusterPromotionTask
          vars:
            - name: chartPath
              value: charts/cert-manager
            - name: chartRepo
              value: https://charts.jetstack.io
            - name: chartName
              value: cert-manager
        - task:
            name: git-ops-commit-pr
            kind: ClusterPromotionTask
          vars:
            - name: commitMessage
              value: |
                Update cert-manager chart dependencies
            - name: prTitle
              value: "Update cert-manager chart dependencies"
            - name: prDescription
              value: Update cert-manager chart dependencies
