# Commits whatever update-image-tag changed in ./repo and opens a PR on targetBranch.
# git-commit skips itself when nothing changed, so the push/PR steps are skipped too
# instead of leaving an empty branch behind.
apiVersion: kargo.akuity.io/v1alpha1
kind: ClusterPromotionTask
metadata:
  name: image-commit-pr
spec:
  vars:
    - name: gitRepo
    - name: targetBranch
    - name: warehouse
    - name: imageRepo
  steps:
    - uses: git-commit
      as: commit-updates
      config:
        path: ./repo
        message: |
          Update image version
          - Image: ${{ imageFrom(vars.imageRepo, warehouse(vars.warehouse)).Tag }}
    - uses: git-push
      as: push-feature-branch
      if: ${{ status('commit-updates') != 'Skipped' }}
      config:
        path: ./repo
        generateTargetBranch: true
    - uses: git-open-pr
      as: open-pr-main
      if: ${{ status('commit-updates') != 'Skipped' }}
      continueOnError: true
      config:
        repoURL: ${{ vars.gitRepo }}
        sourceBranch: ${{ task.outputs['push-feature-branch'].branch }}
        targetBranch: ${{ vars.targetBranch }}
        title: "Update image version"
        description: |
          ## Updates
          - **Image:** `${{ imageFrom(vars.imageRepo, warehouse(vars.warehouse)).Tag }}`
          Updated via Kargo promotion from warehouse: ${{ vars.warehouse }}
    - uses: git-wait-for-pr
      as: wait-pr-approval
      if: ${{ status('open-pr-main') == 'Succeeded' }}
      config:
        repoURL: ${{ vars.gitRepo }}
        prNumber: ${{ task.outputs['open-pr-main'].pr.id }}
