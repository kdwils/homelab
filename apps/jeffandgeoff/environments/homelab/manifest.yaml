spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jeffandgeoff
      app.kubernetes.io/instance: jeffandgeoff
  template:
    metadata:
      labels:
        helm.sh/chart: jeffandgeoff-0.2.1
        app.kubernetes.io/name: jeffandgeoff
        app.kubernetes.io/instance: jeffandgeoff
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: jeffandgeoff
      securityContext:
        {}
      containers:
        - name: jeffandgeoff
          image: "nginx:alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: jeffandgeoff-image
              readOnly: true
      volumes:
        - configMap:
            name: jeffandgeoff-image
          name: jeffandgeoff-image
