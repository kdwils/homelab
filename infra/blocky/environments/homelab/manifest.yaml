apiVersion: v1
kind: ServiceAccount
metadata:
  name: blocky
  labels:
    helm.sh/chart: blocky-0.2.0
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: false
---
# Source: homelab/charts/blocky/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: blocky-config
  labels:
    helm.sh/chart: blocky-0.2.0
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
data:
  config.yml: |
    upstreams:
      groups:
        default:
          - 1.1.1.1
          - 9.9.9.9
    bootstrapDns:
      - tcp+udp:1.1.1.1
    customDNS:
      customTTL: 1h
      mapping:
        int.kyledev.co: 192.168.0.249
        nas.int.kyledev.co: 192.168.0.170
        k8s.int.kyledev.co: 192.168.0.20
        ts.kyledev.co: 100.89.149.17
    blocking:
      denylists:
        ads:
          - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
          - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.txt
      clientGroupsBlock:
        default:
          - ads
      blockType: zeroIp
      loading:
        refreshPeriod: 24h
    ports:
      dns: 5353
      http: 4000
    log:
      level: info
---
