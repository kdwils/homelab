# Source: homelab/charts/blocky/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  labels:
    helm.sh/chart: blocky-0.2.0
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
  template:
    metadata:
      labels:
        helm.sh/chart: blocky-0.2.0
        app.kubernetes.io/name: blocky
        app.kubernetes.io/instance: blocky
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: blocky
      securityContext:
        {}
      containers:
        - name: blocky
          image: "ghcr.io/0xerr0r/blocky:v0.35.0"
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/config/config.yml
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
            - name: http
              containerPort: 4000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - mountPath: /app/config
              name: configmap-blocky-config
              readOnly: true
          env:
            - name: TZ
              value: "America/New_York"
      volumes:
        - configMap:
            name: blocky-config
          name: configmap-blocky-config
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: blocky
            topologyKey: kubernetes.io/hostname
