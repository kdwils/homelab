homelab:
  sealedsecrets:
    - name: cloudflare-api-token-secret
      data:
        api-token: 

  clusterissuer:
    create: true
    clusterissuers:
      - name: letsencrypt-prod
        spec:
          acme:
            server: https://acme-v02.api.letsencrypt.org/directory
            privateKeySecretRef:
              name: letsencrypt-prod
            solvers:
              - dns01:
                  cloudflare:
                    apiTokenSecretRef:
                      name: cloudflare-api-token-secret
                      key: api-token

cert-manager:
  crds:
    enabled: true
    keep: true
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true
  startupapicheck:
    enabled: false
  extraObjects:
    - |
      apiVersion: autoscaling.k8s.io/v1
      kind: VerticalPodAutoscaler
      metadata:
        name: cert-manager
        namespace: cert-manager
      spec:
        targetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: cert-manager
        updatePolicy:
          updateMode: InPlace
        resourcePolicy:
          containerPolicies:
            - containerName: "*"
              maxAllowed:
                cpu: 250m
                memory: 256Mi
              controlledResources:
                - cpu
                - memory
              controlledValues: RequestsAndLimits
    - |
      apiVersion: autoscaling.k8s.io/v1
      kind: VerticalPodAutoscaler
      metadata:
        name: cert-manager-cainjector
        namespace: cert-manager
      spec:
        targetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: cert-manager-cainjector
        updatePolicy:
          updateMode: InPlace
        resourcePolicy:
          containerPolicies:
            - containerName: "*"
              maxAllowed:
                cpu: 250m
                memory: 256Mi
              controlledResources:
                - cpu
                - memory
              controlledValues: RequestsAndLimits
    - |
      apiVersion: autoscaling.k8s.io/v1
      kind: VerticalPodAutoscaler
      metadata:
        name: cert-manager-webhook
        namespace: cert-manager
      spec:
        targetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: cert-manager-webhook
        updatePolicy:
          updateMode: InPlace
        resourcePolicy:
          containerPolicies:
            - containerName: "*"
              maxAllowed:
                cpu: 100m
                memory: 128Mi
              controlledResources:
                - cpu
                - memory
              controlledValues: RequestsAndLimits
