apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: metallb-system:main
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: metallb-system
    server: "https://kubernetes.default.svc"
  source:
    path: infra/metallb/environments/homelab
    repoURL: "https://github.com/kdwils/homelab"
    targetRevision: homelab
  sources: []
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: metallb.io
      kind: BGPPeer
      name: bgppeers.metallb.io
      namespace: metallb-system
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
