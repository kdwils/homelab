apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: cert-manager:homelab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: cert-manager
    server: "https://kubernetes.default.svc"
  source:
    path: infra/cert-manager/environments/homelab
    repoURL: "https://github.com/kdwils/homelab"
    targetRevision: homelab
  sources: []
  project: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
