tempo:
  tempo:
    retention: 72h
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 1Gi
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    metricsGenerator:
      enabled: true
      remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
      storage:
        path: /var/tempo/generator/wal
      traces_storage:
        path: /var/tempo/generator/traces
      processor:
        local_blocks:
          flush_to_storage: true
          filter_server_spans: false
        service_graphs: {}
    overrides:
      defaults:
        metrics_generator:
          processors:
            - local-blocks
            - service-graphs
  persistence:
    enabled: true
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 10Gi
