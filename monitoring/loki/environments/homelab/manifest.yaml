kind: ServiceAccount
metadata:
  name: loki
  namespace: monitoring
  labels:
    helm.sh/chart: loki-7.3.0
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: "3.6.11"
automountServiceAccountToken: true
